[workspace]
resolver = "3"
members = ["crates/fsearch", "crates/finder"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Release plus symbols, for profilers: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = 1
strip = false

# Dev builds: the index and GPUI run optimized, so typing feels real.
[profile.dev.package.fsearch]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
