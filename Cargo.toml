[workspace]
resolver = "3"
members = ["crates/fsearch", "crates/finder", "crates/glass_probe"]
exclude = ["vendor"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Release plus symbols, for profilers: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = 1
strip = false

# Dev builds: the index and GPUI run optimized, so typing feels real.
[profile.dev.package.fsearch]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# Liquid Glass: GPUI core and its Windows renderer carry a glass primitive.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
