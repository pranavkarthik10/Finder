[package]
name = "finder"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
fsearch = { path = "../fsearch" }
anyhow = "1"
chrono = "0.4"
rust-embed = "8"
image = { version = "0.25", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
unicode-segmentation = "1"
